services:
  postgres:
    image: postgres:16
    container_name: devportfolio-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: devportfolio_db
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
    ports:
      - "5432:5432"
    volumes:
      - devportfolio_postgres_data:/var/lib/postgresql/data

volumes:
  devportfolio_postgres_data: